# 生产环境：MySQL + Redis 二级缓存 + Nacos 注册/配置中心
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:forecast}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&useCursorFetch=true&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:forecast}
    password: ${MYSQL_PASSWORD:forecast}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 5000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 3s
      lettuce:
        pool:
          enabled: false

# 生产环境默认关闭接口文档，需要时设置 SPRINGDOC_ENABLED=true
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

forecast:
  cache:
    redis-enabled: ${CACHE_REDIS_ENABLED:true}
  security:
    enabled: ${API_KEY_ENABLED:true}

# 业务数据在独立库时配置（只读连接池）
