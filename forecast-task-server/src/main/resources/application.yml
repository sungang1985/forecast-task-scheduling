server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: 200
    accept-count: 200

spring:
  application:
    name: forecast-task-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 60s
  jackson:
    time-zone: ${TZ:Asia/Shanghai}
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # 演示脚本（可重复迁移）在关闭演示后不再存在，忽略其缺失，避免启动校验失败
    ignore-migration-patterns: "repeatable:missing"
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 500
  global-config:
    banner: false
    db-config:
      id-type: assign_id

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,threaddump,retries,circuitbreakers
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        forecast.task.step: true
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  info:
    env:
      enabled: true
  health:
    redis:
      enabled: ${forecast.cache.redis-enabled}


# ========================= 业务配置 =========================
forecast:
  engine:
    # 直连地址（优先）；留空则通过注册中心按 service-id 选择实例
    base-url: ${ENGINE_BASE_URL:}
    # 与 Python 引擎 ENGINE_TOKEN 保持一致
    token: ${ENGINE_TOKEN:}
    service-id: forecast-python-engine
    connect-timeout: 3s
    read-timeout: 60s
    poll-initial-interval: 500ms
    poll-max-interval: 2s
    retry-max-attempts: 3
    retry-initial-interval: 500ms
    cleanup-datasets: true
    result-page-size: 5000
  cache:
    enabled: true
    local-max-rows: 5000000
    history-ttl: 12h
    hot-ttl: 5m
    hot-window: 3d
    redis-enabled: ${CACHE_REDIS_ENABLED:false}
  task:
    default-timeout: 2h
    max-wait-seconds: 300
    heartbeat-interval: 30s
    stale-timeout: 5m
    step-max-attempts: 2
    step-retry-backoff: 3s
