server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: 200
    accept-count: 200

spring:
  application:
    name: forecast-task-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 60s
  jackson:
    time-zone: ${TZ:Asia/Shanghai}
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # 演示脚本（可重复迁移）在关闭演示后不再存在，忽略其缺失，避免启动校验失败
    ignore-migration-patterns: "repeatable:missing"

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 500
  global-config:
    banner: false
    db-config:
      id-type: assign_id

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,threaddump
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  info:
    env:
      enabled: true
  health:
    redis:
      enabled: ${forecast.cache.redis-enabled}


# ========================= 业务配置 =========================
forecast:
  cache:
    enabled: true
    local-max-rows: 5000000
    history-ttl: 12h
    hot-ttl: 5m
    hot-window: 3d
    redis-enabled: ${CACHE_REDIS_ENABLED:false}
