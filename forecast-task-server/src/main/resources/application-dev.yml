# 开发环境：内嵌 H2（MySQL 兼容模式），自动加载演示表与演示数据，无需外部依赖
spring:
  datasource:
    url: jdbc:h2:file:./data/h2/forecast;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 20
  flyway:
    locations: classpath:db/migration,classpath:db/demo

forecast:
  demo:
    enabled: true
    history-days: 120

logging:
  level:
    com.forecast: debug
    com.forecast.task.mapper: info
